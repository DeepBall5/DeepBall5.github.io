<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Ball</title>
<meta name="description" content="Deep Ball: the daily NFL trivia game where the obvious answer is a kneel-down. Seven plays, a 25-second play clock, and rare answers gain big yards.">
<meta property="og:title" content="Deep Ball">
<meta property="og:description" content="The daily NFL trivia game where the obvious answer is a kneel-down.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://deepball5.github.io/">
<meta property="og:image" content="https://deepball5.github.io/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0a0f2c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%88%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  /* Retro arcade night game: 8-bit frames on a starry navy sky, turf-green field, gold for the big moments. */
  --sky:#0a0f2c;
  --panel:#10173d;
  --well:#060a22;
  --chalk:#f5f2e8;
  --dim:#9aa3cc;
  --gold:#ffd23f;
  --red:#ff4f5e;
  --ink:#05081c;
  --t-k:#cfd5e6; --t-s:#5cb6ff; --t-p:#b892ff; --t-f:#ff9a3d; --t-h:#ffd23f; --t-c:#ff7cc0; --t-x:#6b7499;
  --pixel:"Press Start 2P","Courier New",monospace;
  --mono:"VT323","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--sky);color:var(--chalk);font:23px/1.2 var(--mono)}
.sky{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(rgba(255,255,255,.7) 1px,transparent 1.6px) 0 0/97px 89px,
  radial-gradient(rgba(201,211,255,.45) 1px,transparent 1.6px) 41px 33px/131px 113px,
  radial-gradient(rgba(255,255,255,.35) 1px,transparent 1.6px) 70px 12px/173px 151px,
  linear-gradient(#060a20,#0c1340 55%,#131b4c)}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 64px}
#app{display:flex;flex-direction:column;gap:18px}
.center{text-align:center}
.dim{color:var(--dim)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 8-bit frame: notched corners + hard drop shadow */
.frame{--fc:var(--chalk);background:var(--panel);margin:4px;
  box-shadow:0 -4px 0 0 var(--fc),0 4px 0 0 var(--fc),-4px 0 0 0 var(--fc),4px 0 0 0 var(--fc),10px 10px 0 2px rgba(0,0,0,.45)}

.btn{--fc:var(--ink);--bg:var(--gold);--sh:#c48f00;border:0;cursor:pointer;margin:4px;background:var(--bg);color:var(--ink);
  font:15px/1.2 var(--pixel);text-transform:uppercase;letter-spacing:.03em;padding:16px 20px;
  box-shadow:0 -4px 0 0 var(--fc),0 4px 0 0 var(--fc),-4px 0 0 0 var(--fc),4px 0 0 0 var(--fc),inset -4px -4px 0 0 var(--sh),inset 4px 4px 0 0 rgba(255,255,255,.35),8px 8px 0 2px rgba(0,0,0,.5);
  transition:transform .05s}
.btn:hover{transform:translate(-1px,-2px)}
.btn:active{transform:translate(3px,3px)}
.btn.big{display:block;width:calc(100% - 8px);font-size:clamp(17px,3.4vw,26px);padding:26px 20px}
.btn.ghost{--fc:var(--chalk);--bg:var(--panel);--sh:#090e2a;color:var(--chalk)}
.link{border:0;background:none;cursor:pointer;padding:8px 6px;font:11px/1.4 var(--pixel);text-transform:uppercase;color:var(--dim)}
.link:hover{color:var(--gold)}
.link.invite{color:var(--gold)}
.blink{animation:blink 1s steps(1) infinite}

/* Mascot */
.buddy{display:flex;align-items:flex-end;gap:10px}
.mascot{width:72px;height:56px;image-rendering:pixelated;animation:hop .7s steps(2) infinite}
.buddy.jump .mascot{animation:jump .5s cubic-bezier(.3,1.6,.5,1)}
.bubble{position:relative;margin-bottom:34px;background:var(--chalk);color:var(--ink);font:24px/1 var(--mono);padding:6px 10px 5px;white-space:nowrap;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.bubble::after{content:"";position:absolute;left:-9px;bottom:4px;width:6px;height:6px;background:var(--chalk);box-shadow:-3px 3px 0 0 var(--chalk)}

/* Home */
.hero{position:relative;margin:0 -16px}
#hero{display:block;width:100%;height:auto;image-rendering:pixelated}
.title{position:absolute;left:0;right:0;top:7%;text-align:center}
.title h1{margin:0;font:clamp(32px,8.6vw,68px)/1 var(--pixel);color:var(--gold);letter-spacing:.02em;text-shadow:4px 4px 0 #c2410c,8px 8px 0 #000}
.kicker{margin:14px 0 0;font:clamp(9px,1.7vw,13px)/1 var(--pixel);letter-spacing:.42em;color:var(--chalk);text-shadow:2px 2px 0 #000}
.hero .buddy{position:absolute;left:50%;bottom:7%;transform:translateX(-36px)}
.tagline{margin:0;text-align:center;font-size:26px;color:var(--dim)}
.subrow{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;font:11px/1.4 var(--pixel);color:var(--dim);text-transform:uppercase}
.links{display:flex;flex-wrap:wrap;gap:2px 6px}
.today{padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px}
.today-out{margin:0;font:clamp(16px,3.4vw,24px)/1.3 var(--pixel);color:var(--gold)}
.today-out.punt{color:var(--chalk)}
.next{margin:0;font:11px/1.6 var(--pixel);color:var(--dim);text-align:center}

/* Game */
.hud{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;font:11px/1.6 var(--pixel);color:var(--dim);text-transform:uppercase}
.hud b{color:var(--chalk);font-weight:400}
.hud .push{margin-left:auto}
.strip{margin:4px;box-shadow:0 -4px 0 0 var(--chalk),0 4px 0 0 var(--chalk),-4px 0 0 0 var(--chalk),4px 0 0 0 var(--chalk),10px 10px 0 2px rgba(0,0,0,.45)}
#strip{display:block;width:100%;height:auto;image-rendering:pixelated}
.zone{margin:-4px 0 0;text-align:center;color:var(--dim);font-size:24px}
.zone b{font:11px/1 var(--pixel);color:var(--gold);font-weight:400;letter-spacing:.06em}
.card{padding:clamp(18px,4vw,30px);display:flex;flex-direction:column;gap:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{margin:0;font:11px/1.6 var(--pixel);color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.clock{--fc:#3d2c07;font:30px/1 var(--pixel);color:#ffb21a;background:#000;padding:12px 12px 10px;min-width:3.4em;text-align:center;text-shadow:0 0 12px rgba(255,178,26,.6);
  box-shadow:0 -4px 0 0 var(--fc),0 4px 0 0 var(--fc),-4px 0 0 0 var(--fc),4px 0 0 0 var(--fc);margin:4px}
.clock.hot{color:var(--red);text-shadow:0 0 12px rgba(255,79,94,.7);animation:blink .5s steps(1) infinite}
.q{margin:0;font:clamp(34px,5.8vw,48px)/1 var(--mono);text-wrap:balance}
.sub{margin:-6px 0 0;color:var(--dim)}
.answer{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.inwrap{flex:1 1 280px;min-width:0;margin:4px}
.inwrap input{--fc:var(--chalk);width:100%;display:block;border:0;outline:none;background:var(--well);color:var(--chalk);font:36px/1 var(--mono);padding:12px 14px 10px;border-radius:0;
  box-shadow:0 -4px 0 0 var(--fc),0 4px 0 0 var(--fc),-4px 0 0 0 var(--fc),4px 0 0 0 var(--fc)}
.inwrap input::placeholder{color:#4a5385}
.inwrap input:focus{--fc:var(--gold)}
.inwrap.bad input{--fc:var(--red)}
.inwrap.shake{animation:shake .4s steps(6)}
.fb{margin:0;min-height:16px;font:16px/1 var(--pixel);color:var(--red)}
.misses{list-style:none;margin:-6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--dim)}
.misses li{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.bar{height:8px;background:var(--well)}
.bar i{display:block;height:100%;background:#ffb21a;transform-origin:left center}
.bar.hot i{background:var(--red)}

.stamp{margin:0;text-transform:uppercase;font:clamp(24px,6vw,46px)/1.15 var(--pixel);color:var(--c);text-shadow:4px 4px 0 #000;animation:pop .55s cubic-bezier(.2,1.7,.4,1) both}
.yds{margin:0;font:clamp(16px,3vw,22px)/1 var(--pixel)}
.said{margin:0;font-size:30px}
.said b{color:var(--c);font-weight:400}
.deep{margin:0;color:var(--dim)}
.deep b{color:var(--chalk);font-weight:400}

.big-out{margin:6px 0 0;text-align:center;font:clamp(28px,7.4vw,58px)/1.1 var(--pixel);color:var(--gold);text-shadow:4px 4px 0 #c2410c,8px 8px 0 #000;animation:pop .6s cubic-bezier(.2,1.7,.4,1) both}
.big-out.punt{color:var(--chalk);text-shadow:4px 4px 0 #39417a,8px 8px 0 #000}
.sum{margin:0;text-align:center;font-size:28px}
.emo{margin:0;text-align:center;font-size:30px;letter-spacing:6px}
.copyrow{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.toast{font:11px/1.4 var(--pixel);color:var(--gold)}
.recap-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:-6px}
.recap-hint{margin:0;font:10px/1.6 var(--pixel);color:var(--dim);text-transform:uppercase}
.recap{list-style:none;margin:0;padding:0;border-top:2px dashed #2a3470}
.recap>li{border-bottom:2px dashed #2a3470;padding:10px 2px}
.rrow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:baseline}
.rrow .rq{grid-column:2}
.rrow .you{grid-column:2;color:var(--dim)}
.rrow .ans-btn{grid-column:3;grid-row:1 / span 2;align-self:center}
.ans-btn{border:0;cursor:pointer;background:var(--well);color:var(--chalk);font:9px/1 var(--pixel);text-transform:uppercase;padding:9px 10px 8px;white-space:nowrap;
  box-shadow:0 -2px 0 0 var(--c,var(--dim)),0 2px 0 0 var(--c,var(--dim)),-2px 0 0 0 var(--c,var(--dim)),2px 0 0 0 var(--c,var(--dim))}
.ans-btn:hover{color:var(--gold)}
.ans-btn.all{--c:var(--gold)}
.ans-panel{margin:12px 0 4px;padding:12px 14px;background:var(--well)}
.ans-head{margin:0 0 10px;font:9px/1.6 var(--pixel);color:var(--dim);text-transform:uppercase}
.chip{font:10px/1 var(--pixel);color:var(--ink);background:var(--c);padding:6px 6px 5px;white-space:nowrap;text-transform:uppercase}
.groups{display:flex;flex-direction:column;gap:6px;padding:0 2px 12px;font-size:21px;line-height:1.15}
.groups>div{display:grid;grid-template-columns:132px 1fr;gap:10px}
.groups .gl{font:9px/2 var(--pixel);color:var(--c);text-transform:uppercase}
.groups .gl i{font-style:normal;color:var(--dim)}
.groups .mine{color:var(--gold);text-decoration:underline}
.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 12px}

/* Archive */
.archive{display:flex;flex-direction:column;gap:20px}
.arch-head{text-align:center;display:flex;flex-direction:column;gap:10px}
.arch-title{margin:6px 0 0;font:clamp(24px,6vw,44px)/1.1 var(--pixel);color:var(--gold);text-shadow:4px 4px 0 #c2410c,8px 8px 0 #000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 16px}
.tile{border:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;padding:14px 14px 12px;color:var(--chalk);transition:transform .05s}
.tile:hover{transform:translate(-1px,-2px)}
.tile.today{--fc:var(--gold)}
.tile .tn{font:16px/1 var(--pixel);color:var(--gold)}
.tile .tdate{font:9px/1.4 var(--pixel);color:var(--dim)}
.tile .ts{font:10px/1.4 var(--pixel);text-transform:uppercase}
.tile .ts.go{color:var(--chalk)}
.tile .ts.td{color:var(--gold)}
.tile .ts.fg{color:var(--t-s)}
.tile .ts.punt{color:var(--dim)}
.tile .te{font-size:13px;letter-spacing:1px;line-height:1}

/* Modal */
.modal{position:fixed;inset:0;z-index:30;background:rgba(3,5,18,.78);display:flex;align-items:center;justify-content:center;padding:18px}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:640px;max-height:90%;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font:18px/1.3 var(--pixel);color:var(--gold)}
.sheet p{margin:0}
.sheet .close{align-self:flex-end}
.tiers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tiers li{display:grid;grid-template-columns:150px 70px 1fr;gap:10px;align-items:baseline}
.tiers .n{font:10px/1.6 var(--pixel);color:var(--c);text-transform:uppercase}
.tiers .y{font:10px/1.6 var(--pixel)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.stat{padding:12px;text-align:center}
.stat b{display:block;font:26px/1.3 var(--pixel);color:var(--gold);font-weight:400}
.stat span{font:9px/1.5 var(--pixel);color:var(--dim);text-transform:uppercase}

#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
#confetti i{position:absolute;top:-14px;animation:fall linear forwards}

:focus-visible{outline:3px dashed var(--gold);outline-offset:6px}
.inwrap input:focus-visible{outline:none}

@keyframes blink{50%{opacity:0}}
@keyframes hop{50%{transform:translateY(-4px)}}
@keyframes jump{0%{transform:translateY(0)}40%{transform:translateY(-22px)}100%{transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(var(--r))}}

@media (max-width:600px){
  body{font-size:21px}
  .mascot{width:54px;height:42px}
  .bubble{font-size:20px;margin-bottom:24px}
  .groups>div,.tiers li{grid-template-columns:1fr;gap:2px}
  .rrow{grid-template-columns:1fr}
  .rrow .rq,.rrow .you,.rrow .ans-btn{grid-column:1;grid-row:auto}
  .rrow .ans-btn{justify-self:start;margin-top:8px}
  .grid{grid-template-columns:repeat(2,1fr);gap:14px 12px}
  .hud{gap:4px 12px;font-size:9px}
  .clock{font-size:22px}
  .inwrap input{font-size:28px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="wrap"><main id="app"></main></div>
<div id="confetti" aria-hidden="true"></div>
<div class="modal" id="modal" hidden><div class="sheet frame" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div></div>
<script>
/* Deep Ball — answer banks. Current through Super Bowl LX (Feb 2026), the 2025 season and the 2026 draft.
   Tiers: K Kneel-Down, S Screen Pass, P Play-Action, F Flea Flicker, H Hail Mary, C Too Cute.
   Answer strings are "Display|alias|alias". Team prompts list team ids. */

const TEAMS = {
  cardinals:'Arizona Cardinals|arizona|cardinals|cards|ari|az cardinals|st louis cardinals|phoenix cardinals|chicago cardinals',
  falcons:'Atlanta Falcons|atlanta|falcons|atl|dirty birds',
  ravens:'Baltimore Ravens|baltimore|ravens|bal',
  bills:'Buffalo Bills|buffalo|bills|buf',
  panthers:'Carolina Panthers|carolina|panthers|car',
  bears:'Chicago Bears|chicago|bears|chi|da bears|monsters of the midway',
  bengals:'Cincinnati Bengals|cincinnati|cincy|cinci|bengals|cin',
  browns:'Cleveland Browns|cleveland|browns|cle',
  cowboys:'Dallas Cowboys|dallas|cowboys|dal|americas team',
  broncos:'Denver Broncos|denver|broncos|den',
  lions:'Detroit Lions|detroit|lions|det',
  packers:'Green Bay Packers|green bay|packers|gb|pack',
  texans:'Houston Texans|houston|texans|hou',
  colts:'Indianapolis Colts|indianapolis|indy|colts|ind|baltimore colts',
  jaguars:'Jacksonville Jaguars|jacksonville|jaguars|jags|jax',
  chiefs:'Kansas City Chiefs|kansas city|chiefs|kc|dallas texans',
  raiders:'Las Vegas Raiders|las vegas|vegas|raiders|lv|oakland|oakland raiders|los angeles raiders|la raiders',
  chargers:'Los Angeles Chargers|chargers|la chargers|bolts|san diego|san diego chargers|lac',
  rams:'Los Angeles Rams|rams|la rams|st louis rams|cleveland rams|lar',
  dolphins:'Miami Dolphins|miami|dolphins|mia|fins|phins',
  vikings:'Minnesota Vikings|minnesota|vikings|vikes|min',
  patriots:'New England Patriots|new england|patriots|pats|ne|boston patriots',
  saints:'New Orleans Saints|new orleans|saints|nola',
  giants:'New York Giants|giants|ny giants|nyg|g men|big blue',
  jets:'New York Jets|jets|ny jets|nyj|gang green|new york titans',
  eagles:'Philadelphia Eagles|philadelphia|philly|eagles|phi|birds',
  steelers:'Pittsburgh Steelers|pittsburgh|steelers|pit|steel curtain',
  niners:'San Francisco 49ers|san francisco|49ers|niners|forty niners|sf|9ers',
  seahawks:'Seattle Seahawks|seattle|seahawks|sea|hawks',
  buccaneers:'Tampa Bay Buccaneers|tampa bay|tampa|buccaneers|bucs|tb',
  titans:'Tennessee Titans|tennessee|titans|ten|oilers|houston oilers|tennessee oilers',
  commanders:'Washington Commanders|washington|commanders|was|wsh|redskins|washington redskins|washington football team|wft'
};
const AFC = ['bills','dolphins','patriots','jets','ravens','bengals','browns','steelers','texans','colts','jaguars','titans','broncos','chiefs','raiders','chargers'];
const NFC = ['cowboys','eagles','giants','commanders','bears','lions','packers','vikings','falcons','panthers','saints','buccaneers','cardinals','rams','niners','seahawks'];

/* Super Bowl record per franchise through LX: [wins, losses, most recent win] */
const SB = {
  steelers:[6,2,43], patriots:[6,6,53], niners:[5,3,29], cowboys:[5,3,30], packers:[4,1,45], giants:[4,1,46],
  chiefs:[4,3,58], broncos:[3,5,50], raiders:[3,2,18], commanders:[3,2,26], dolphins:[2,3,8], rams:[2,3,56],
  seahawks:[2,2,60], eagles:[2,3,59], ravens:[2,0,47], buccaneers:[2,0,55], colts:[2,2,41], saints:[1,0,44],
  bears:[1,1,20], jets:[1,0,3], vikings:[0,4,0], bills:[0,4,0], bengals:[0,3,0], falcons:[0,2,0], panthers:[0,2,0],
  titans:[0,1,0], cardinals:[0,1,0], chargers:[0,1,0], lions:[0,0,0], browns:[0,0,0], texans:[0,0,0], jaguars:[0,0,0]
};
function roman(n){
  if (n === 50) return '50';
  const m = [[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']]; let s = '';
  for (const [v,r] of m) while (n >= v) { s += r; n -= v; }
  return s;
}
function sbRecord(id){ const [w,l] = SB[id]; return (w + l === 0) ? 'Has never played in a Super Bowl.' : `${w}–${l} in Super Bowls.`; }
function teamNope(filter, msg){ const o = {}; for (const id of Object.keys(TEAMS)) if (filter(id)) o['@'+id] = msg(id); return o; }

const PROMPTS = [
/* ---------- Teams & conferences ---------- */
{ id:'teams', fam:'conf', kind:'team', q:'Name an NFL team.', sub:'Any of the 32.',
  a:{ K:['cowboys','patriots','packers','steelers','chiefs','niners','eagles'],
      S:['bears','giants','raiders','broncos','seahawks','dolphins','ravens','bills'],
      P:['rams','saints','vikings','lions','jets','colts','bengals','browns','commanders','chargers'],
      F:['falcons','panthers','cardinals','buccaneers'],
      H:['jaguars','texans','titans'] } },

{ id:'afc', fam:'conf', kind:'team', q:'Name a team in the AFC.', sub:'Any of the 16.',
  a:{ K:['chiefs','patriots','steelers'], S:['bills','ravens','broncos','dolphins','raiders'],
      P:['jets','bengals','browns','chargers','colts'], F:['texans','titans'], H:['jaguars'] },
  nope: teamNope(id => NFC.includes(id), () => 'That’s an NFC team.') },

{ id:'nfc', fam:'conf', kind:'team', q:'Name a team in the NFC.', sub:'Any of the 16.',
  a:{ K:['cowboys','packers','eagles','niners'], S:['bears','giants','seahawks','lions'],
      P:['vikings','rams','saints','commanders'], F:['falcons','buccaneers','cardinals'], H:['panthers'] },
  nope: teamNope(id => AFC.includes(id), () => 'That’s an AFC team.') },

    for (const f of forms){
      const k = keyOf(f, p.kind);
      if (!k || exact.has(k) || nopeExact.has(k)) continue;
      nopeExact.set(k, { msg, label: label[0] === '@' ? forms[0] : label });
      nopeFuzzy.push({ k, thr: allowed(k.length), msg, label: label[0] === '@' ? forms[0] : label });
    }
  }
  const c = { entries, exact, fuzzy, nopeExact, nopeFuzzy };
  _compiled.set(p.id, c);
  return c;
}

function nearest(list, k){
  let best = null;
  for (const f of list){
    if (Math.abs(f.k.length - k.length) > f.thr) continue;
    const d = osa(k, f.k);
    if (d <= f.thr && (!best || d < best.d)) best = { d, f };
  }
  return best && best.f;
}

/* Returns { tier, name?, why? } */
function judge(p, input){
  const c = compile(p);
  const k = keyOf(input, p.kind);
  if (!k) return { tier:'X', why:'blank' };
  const hit = i => ({ tier: c.entries[i].tier, name: c.entries[i].name });
  if (c.exact.has(k)) return hit(c.exact.get(k));
  const alt = k.endsWith('s') ? k.slice(0, -1) : k + 's';
  if (c.exact.has(alt)) return hit(c.exact.get(alt));
  if (c.nopeExact.has(k)) { const n = c.nopeExact.get(k); return { tier:'X', why:n.msg, label:n.label }; }
  const f = nearest(c.fuzzy, k);
  if (f) return hit(f.idx);
  const nf = nearest(c.nopeFuzzy, k);
  if (nf) return { tier:'X', why:nf.msg, label:nf.label };
  return { tier:'X', why:'miss' };
}

function hash(str){
  let h = 1779033703 ^ str.length;

  h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909);
  return (h ^ h >>> 16) >>> 0;
}

/* Drive building: each drive = 2 position prompts, 1 franchise, 1 classic, 1 draft class, 1 team, 1 other. */
const QUOTA = [['pos',2],['club',1],['classic',1],['draft',1],['team',1],['other',1]];
const EPOCH = '2026-07-28';                      // Drive #1
function dayIndex(ds){ return Math.round((new Date(ds + 'T12:00:00') - new Date(EPOCH + 'T12:00:00')) / 864e5); }
function dateOfIndex(i){ const d = new Date(EPOCH + 'T12:00:00'); d.setDate(d.getDate() + i); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function shuffleWith(rand, arr){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function groupIds(sub){ return PROMPTS.filter(p => p.sub2 === sub).map(p => p.id).sort(); }
function famOf(id){ const p = PROMPTS.find(q => q.id === id); return p ? p.fam : id; }
function pickDrive(rand){
  const fams = new Set(), ids = [];
  for (const [sub, k] of QUOTA){
    let n = 0;
    for (const id of shuffleWith(rand, groupIds(sub))){ if (n === k) break; if (fams.has(famOf(id))) continue; fams.add(famOf(id)); ids.push(id); n++; }
  }
  return shuffleWith(rand, ids);
}
let _sched = [];
function scheduleUpTo(n){
  if (_sched.length > n) return _sched;
  const R = mulberry32(hash('deepball-schedule-v3')), decks = {}, last = {}; _sched = [];
  const limit = Math.max(n, 730);
  for (let d = 0; d <= limit; d++){
    const fams = new Set(), ids = [];
    for (const [sub, k] of QUOTA){
      const group = groupIds(sub), want = Math.max(1, Math.floor(group.length / k) - 2);
      const q = decks[sub] || (decks[sub] = []);
      const ok = (id, strict) => !fams.has(famOf(id)) && !ids.includes(id) && (!strict || d - (last[id] ?? -999) > want);
      let got = 0;
      while (got < k){
        let i = q.findIndex(id => ok(id, true));
        if (i < 0 && q.length < group.length * 2){ q.push(...shuffleWith(R, group)); continue; }
        if (i < 0) i = q.findIndex(id => ok(id, false));
        if (i < 0){ q.push(...shuffleWith(R, group)); i = q.findIndex(id => ok(id, false)); if (i < 0) break; }
        const id = q.splice(i, 1)[0]; ids.push(id); fams.add(famOf(id)); last[id] = d; got++;
      }
    }
    _sched.push(shuffleWith(R, ids));
  }
  return _sched;
}
function dailyIds(date){ const i = dayIndex(date); return i < 0 ? pickDrive(mulberry32(hash('deepball:' + date))) : scheduleUpTo(i)[i]; }

function yardsOf(ans){ return ans.reduce((s, a) => s + TIER[a.tier].yds, 0); }

function outcome(yds){
  const pos = START + yds;
  if (pos >= 100) return { k:'td', label:'Touchdown', line:`${yds} yards on seven plays. Spike it.` };
  if (pos >= 65) return { k:'fg', label:'Field goal', line:`${yds} yards. Good from ${100 - pos + 17} out.` };
  return { k:'punt', label:'Punt', line:`${yds} yards. Stalled at the ${spot(pos)}. Punt team, you\u2019re up.` };
}

  for (let y = 0; y < 100; y += 10){ x.fillStyle = (y / 10) % 2 ? '#23893f' : '#1f7d39'; x.fillRect(sx(y), 14, 20, 42); }
  x.fillStyle = '#17652e'; x.fillRect(0, 14, EZ, 42); x.fillRect(SW - EZ, 14, EZ, 42);

    <p class="tagline">7 plays · 25-second play clock · rare answers gain big yards</p>
    ${main}
    <div class="subrow"><span>Drive #${driveNo(g.date)} · ${shortDate(g.date)}</span>
      <span class="links"><button class="link invite" id="invite">Invite friends</button><button class="link" id="archive">Archive</button><button class="link" id="practice">Practice ∞</button><button class="link" id="stats">Stats</button><button class="link" id="help">How to play</button>${sndBtn()}</span></div>
  </section>`;
}

function hud(g){
  const yds = yardsOf(g.ans), pos = START + yds;
  const playN = g.phase === 'final' ? 'FINAL' : `${Math.min(g.ans.length + (g.phase === 'play' ? 1 : 0), PLAYS)}/${PLAYS}`;
  const ball = pos >= 100 ? 'END ZONE' : spot(pos).toUpperCase();
  const z = zone(pos);
  return `<header class="hud"><button class="link" id="home">◀ ${S.mode === 'archive' ? 'Archive' : 'Home'}</button>
      <span>${S.mode === 'practice' ? '<b>Practice</b>' : `Drive <b>#${driveNo(g.date)}</b>`}</span>
      <span>Play <b>${playN}</b></span><span>Ball <b>${ball}</b></span><span><b>${yds}</b> yds</span>
      <span class="push">${sndBtn()}</span></header>
    <div class="strip"><canvas id="strip" width="248" height="60" role="img" aria-label="Drive chart. Ball on the ${esc(ball.toLowerCase())}."></canvas></div>
    <p class="zone"><b>── ${z[0]} ──</b> ${z[1]}</p>`;
}

function viewPlay(g){
  const p = PMAP[g.ids[g.ans.length]];
  return `<div class="card frame">
      <div class="row"><p class="eyebrow">Play ${g.ans.length + 1} of ${PLAYS}</p><div class="clock" id="clock" role="timer" aria-label="Play clock">${CLOCK}</div></div>
      <h2 class="q">${esc(p.q)}</h2>
      <p class="sub">${esc(p.sub)}</p>
      <form class="answer" id="answer" autocomplete="off">
        <label for="ans" class="sr">Your answer</label>
        <div class="inwrap" id="inwrap"><input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type an answer" enterkeyhint="go"></div>
        <button class="btn" type="submit">Snap</button>
      </form>
      <p class="fb" id="fb" role="status" aria-live="assertive"></p>
      <ul class="misses" id="misses" aria-label="Wrong guesses">${g.miss.map(m => `<li>${esc(m)}</li>`).join('')}</ul>
      <div class="bar" id="clockbar"><i id="bar"></i></div>
    </div>
    ${buddy(pick(LINES.play))}`;
}

function deepOptions(p, exclude){
  const out = [];
  for (const t of ['H','F']) for (const e of compile(p).entries) if (e.tier === t && e.name !== exclude && out.length < 3) out.push(e.name);
  return out;
}
function viewResult(g){
  const a = g.ans[g.ans.length - 1], p = PMAP[g.ids[g.ans.length - 1]], T = TIER[a.tier];
  const said = a.tier === 'X' ? 'Time’s up.' : (keyOf(a.text, p.kind) === keyOf(a.name, p.kind) ? `<b>${esc(a.name)}</b>` : `“${esc(a.text)}” → <b>${esc(a.name)}</b>`);
  const deep = deepOptions(p, a.name), last = g.ans.length === PLAYS;
  return `<div class="card frame" style="--c:${T.c}">
      <p class="eyebrow">Play ${g.ans.length} of ${PLAYS} · ${esc(p.q)}</p>
      <p class="stamp">${T.name}</p>
      <p class="yds">+${T.yds} yds</p>
      <p class="said">${said}</p>
      ${a.miss ? `<p class="dim" style="margin:0">after ${a.miss} wrong ${a.miss === 1 ? 'guess' : 'guesses'}</p>` : ''}
      ${deep.length ? `<p class="deep">deep shots on the board: ${deep.map(n => `<b>${esc(n)}</b>`).join(' · ')}</p>` : ''}
      <div><button class="btn" id="next">${last ? 'Final whistle' : 'Next play'} ▶</button></div>
    </div>
    ${buddy(pick(LINES[a.tier]))}`;
}

function shareText(g){
  const yds = yardsOf(g.ans), o = outcome(yds);
  return `${S.mode === 'practice' ? 'Deep Ball practice' : `Deep Ball #${driveNo(g.date)}`} 🏈 ${o.label.toUpperCase()} · ${yds} yds\n${g.ans.map(a => TIER[a.tier].e).join('')}${GAME_URL ? '\n' + GAME_URL : ''}`;
}
function answersHTML(p, mine){
  return '<div class="groups">' + RAREST_FIRST.map(t => {
    const names = compile(p).entries.filter(e => e.tier === t).map(e => e.name === mine ? `<span class="mine">${esc(e.name)}</span>` : esc(e.name));
    return names.length ? `<div style="--c:${TIER[t].c}"><span class="gl">${TIER[t].name} <i>(${names.length})</i></span><span>${names.join(', ')}</span></div>` : '';
  }).join('') + '</div>';
}
function viewFinal(g){
  const yds = yardsOf(g.ans), o = outcome(yds), mode = S.mode;
  const rows = g.ans.map((a, i) => {
    const p = PMAP[g.ids[i]], T = TIER[a.tier], n = compile(p).entries.length;
    const you = a.tier === 'X' ? 'no answer in time' : esc(a.name);
    return `<li style="--c:${T.c}">
        <div class="rrow"><span class="chip">${T.name} +${T.yds}</span><span class="rq">${esc(p.q)}</span>
          <span class="you">you: ${you}${a.miss ? ` · ${a.miss} miss${a.miss === 1 ? '' : 'es'}` : ''}</span>
          <button class="ans-btn" data-i="${i}" aria-expanded="false" aria-controls="ans-${i}">Show answers ▼</button></div>
        <div class="ans-panel" id="ans-${i}" hidden><p class="ans-head">${n} answers on the board, rarest first</p>${answersHTML(p, a.name)}</div>
      </li>`;
  }).join('');
  const eyebrow = mode === 'daily' ? `Drive #${driveNo(g.date)} · final` : mode === 'archive' ? `Drive #${driveNo(g.date)} · ${shortDate(g.date)} · final` : 'Practice drive · final';
  const actions = mode === 'daily'
    ? '<button class="btn" id="toArchive">Archive</button><button class="btn ghost" id="again">Practice ∞</button><button class="btn ghost" id="home2">Home</button>'
    : mode === 'archive'
      ? '<button class="btn" id="nextArchive">Next unplayed drive ▶</button><button class="btn ghost" id="toArchive">Archive</button><button class="btn ghost" id="home2">Home</button>'
      : '<button class="btn" id="again">Another drive ∞</button><button class="btn ghost" id="home2">Home</button>';
  return `<div class="card frame">
      <p class="eyebrow center">${eyebrow}</p>
      <h2 class="big-out ${o.k}">${o.label.toUpperCase()}${o.k === 'td' ? '!' : ''}</h2>
      <p class="sum">${o.line}</p>
      <p class="emo" aria-label="Your seven plays">${g.ans.map(a => TIER[a.tier].e).join('')}</p>
      <div class="copyrow"><button class="btn ghost" id="copy">Copy result</button><span class="toast" id="toast" role="status"></span></div>
      <div class="recap-top"><p class="recap-hint">The recap</p><button class="ans-btn all" id="allAns" aria-expanded="false">Show all answers ▼</button></div>
      <ol class="recap">${rows}</ol>
      <div class="actions">${actions}</div>
      ${mode === 'daily' ? '<p class="next" id="nextin"></p>' : ''}
    </div>
    ${buddy(pick(LINES[o.k]))}`;
}

/* ---------- archive ---------- */
function archiveDates(){ const out = [], t = dayIndex(todayStr()); for (let i = t - 1; i >= 0; i--) out.push(dateOfIndex(i)); return out; }
function viewArchive(){
  const dates = archiveDates(), done = dates.filter(d => store.days[d] && store.days[d].phase === 'final').length;
  const tile = (d, today) => {
    const r = store.days[d], n = driveNo(d);
    let status = '<span class="ts go">▶ Play</span>';
    if (r && r.phase === 'final'){ const y = yardsOf(r.ans), o = outcome(y); status = `<span class="ts ${o.k}">${o.k === 'td' ? 'TD' : o.k === 'fg' ? 'FG' : 'PUNT'} · ${y}</span><span class="te">${r.ans.map(a => TIER[a.tier].e).join('')}</span>`; }
    else if (r && (r.ans.length || r.miss.length)) status = `<span class="ts go">▶ Resume ${r.ans.length}/7</span>`;
    return `<button class="tile frame${today ? ' today' : ''}" data-date="${d}"><span class="tn">#${n}</span><span class="tdate">${today ? 'TODAY' : shortDate(d)}</span>${status}</button>`;
  };
  return `<section class="archive">
      <header class="hud"><button class="link" id="home">◀ Home</button><span class="push">${sndBtn()}</span></header>
      <div class="arch-head"><h2 class="arch-title">THE ARCHIVE</h2>
        <p class="tagline">Every past daily drive. ${done} of ${dates.length} played.</p></div>
      <div class="grid">${tile(S.daily.date, true)}${dates.map(d => tile(d, false)).join('')}</div>
    </section>`;
}
function openArchive(date){
  stopClock();
  if (date === todayStr()){ S.mode = 'daily'; goGame(); return; }
  const r = store.days[date];
  S.archive = (r && r.ids && r.ids.every(id => PMAP[id])) ? clone(r) : Object.assign(freshDrive(dailyIds(date)), { date });
  if (!S.archive.miss) S.archive.miss = [];
  S.mode = 'archive'; goGame();
}
function goArchive(){ stopClock(); persist(); S.mode = 'daily'; S.screen = 'archive'; render(); window.scrollTo(0, 0); }

/* ---------- play clock ---------- */
let raf = 0, deadline = 0, lastSec = CLOCK;
function stopClock(){ if (raf){ cancelAnimationFrame(raf); raf = 0; const g = cur(); if (g && g.phase === 'play') g.left = Math.max(1000, deadline - performance.now()); } }
function startClock(ms){
  deadline = performance.now() + ms; lastSec = Math.ceil(ms / 1000);
  const clock = $('#clock'), bar = $('#bar'), cb = $('#clockbar');
  const tick = () => {
    const left = Math.max(0, deadline - performance.now()), secs = Math.ceil(left / 1000);
    if (secs !== lastSec){ lastSec = secs; clock.textContent = secs; if (secs <= 5 && secs > 0){ sfx('tick'); if (secs === 5) say(pick(LINES.hurry), true); } }
    const hot = left <= 5000; clock.classList.toggle('hot', hot); cb.classList.toggle('hot', hot);
    bar.style.transform = `scaleX(${left / (CLOCK * 1000)})`;
    if (left <= 0){ raf = 0; submit(true); return; }
    raf = requestAnimationFrame(tick);
  };
  clock.textContent = lastSec;
  raf = requestAnimationFrame(tick);
}

/* ---------- actions ---------- */
function submit(timedOut){
  const g = cur(); if (g.phase !== 'play') return;
  const input = $('#ans'), text = (input ? input.value : '').trim();
  const p = PMAP[g.ids[g.ans.length]], r = judge(p, text);
  if (r.tier !== 'X' || timedOut){
    raf && cancelAnimationFrame(raf); raf = 0;
    const ok = r.tier !== 'X';
    g.ans.push({ text, tier: ok ? r.tier : 'X', name: ok ? r.name : null, miss: g.miss.length });
    g.miss = []; g.left = null; g.phase = 'result';
    persist(); sfx(ok ? r.tier : 'buzzer');
    render({ animate:true });
    if (ok && r.tier === 'H'){ confetti(46); say(pick(LINES.H), true); }
    return;
  }
  if (!text){ input && input.focus(); return; }
  g.miss.push(text); persist(); sfx('wrong');
  input.value = ''; input.focus();
  const w = $('#inwrap'); w.classList.remove('shake', 'bad'); void w.offsetWidth; w.classList.add('shake', 'bad');
  setTimeout(() => w.classList.remove('bad'), 700);
  $('#fb').textContent = 'WRONG!';
  setTimeout(() => { const fb = $('#fb'); if (fb && fb.textContent === 'WRONG!') fb.textContent = ''; }, 1300);
  $('#misses').insertAdjacentHTML('beforeend', `<li>${esc(text)}</li>`);
  say(pick(LINES.wrong), true);
}
function next(){
  const g = cur();
  if (g.ans.length >= PLAYS){
    g.phase = 'final'; g.finishedOn = todayStr(); persist(); render();
    const o = outcome(yardsOf(g.ans)); sfx(o.k); if (o.k === 'td') confetti(150);
  } else { g.phase = 'play'; persist(); render(); sfx('start'); }
}
function goGame(){ S.screen = 'game'; render(); if (cur().phase === 'play') sfx('start'); }
function goHome(){ stopClock(); persist(); S.mode = 'daily'; S.screen = 'home'; render(); window.scrollTo(0, 0); }
function startPractice(){ stopClock(); S.mode = 'practice'; S.practice = freshDrive(pickDrive(Math.random)); goGame(); }
function toggleSound(){ store.snd = !store.snd; save(); document.querySelectorAll('#snd').forEach(b => { b.textContent = store.snd ? 'SOUND ON' : 'SOUND OFF'; b.setAttribute('aria-pressed', String(store.snd)); }); if (store.snd) sfx('S'); }

/* ---------- render ---------- */
let countdown = 0;
function render(opts = {}){
  ensureDaily(); stopHero(); clearInterval(countdown);
  if (raf){ cancelAnimationFrame(raf); raf = 0; }
  const app = $('#app');
  if (S.screen === 'home'){
    S.mode = 'daily';
    app.innerHTML = viewHome(); paintMascots(); startHero();
    $('#go').onclick = goGame;
    $('#archive').onclick = goArchive;
    $('#invite').onclick = () => copyText(`Play Deep Ball with me: the daily NFL trivia game where the obvious answer is a kneel-down.${GAME_URL ? ' ' + GAME_URL : ''}`, () => { const b = $('#invite'); b.textContent = 'Link copied!'; setTimeout(() => { if ($('#invite')) $('#invite').textContent = 'Invite friends'; }, 1800); });
    $('#practice').onclick = startPractice;
    $('#stats').onclick = () => openSheet(statsHTML());
    $('#help').onclick = () => openSheet(helpHTML());
    $('#snd').onclick = toggleSound;
    if (S.daily.phase === 'final'){ tickCountdown(); countdown = setInterval(tickCountdown, 1000); }
    $('#go').focus({ preventScroll:true });
    return;
  }
  if (S.screen === 'archive'){
    app.innerHTML = viewArchive();
    $('#home').onclick = goHome; $('#snd').onclick = toggleSound;
    document.querySelectorAll('.tile').forEach(b => b.onclick = () => openArchive(b.dataset.date));
    return;
  }
  const g = cur();
  const body = g.phase === 'play' ? viewPlay(g) : g.phase === 'result' ? viewResult(g) : viewFinal(g);
  app.innerHTML = hud(g) + body;
  paintMascots();
  if (opts.animate) animateStrip(g); else drawStrip(g, 1);
  $('#home').onclick = S.mode === 'archive' ? goArchive : goHome; $('#snd').onclick = toggleSound;
  if (g.phase === 'play'){
    $('#answer').onsubmit = e => { e.preventDefault(); submit(false); };
    $('#ans').focus({ preventScroll:true });
    startClock(g.left || CLOCK * 1000);
  } else if (g.phase === 'result'){
    $('#next').onclick = next; $('#next').focus({ preventScroll:true });
  } else {
    $('#copy').onclick = copyShare;
    const bind = (id, fn) => { const b = $('#' + id); if (b) b.onclick = fn; };
    bind('again', startPractice); bind('home2', goHome); bind('toArchive', goArchive);
    bind('nextArchive', () => { const d = archiveDates().find(x => !(store.days[x] && store.days[x].phase === 'final')); d ? openArchive(d) : goArchive(); });
    document.querySelectorAll('.ans-btn[data-i]').forEach(b => b.onclick = () => toggleAns(b));
    $('#allAns').onclick = () => {
      const btn = $('#allAns'), open = btn.getAttribute('aria-expanded') !== 'true';
      document.querySelectorAll('.ans-btn[data-i]').forEach(b => toggleAns(b, open));
      btn.setAttribute('aria-expanded', String(open)); btn.textContent = open ? 'Hide all answers ▲' : 'Show all answers ▼';
    };
    if (S.mode === 'daily'){ tickCountdown(); countdown = setInterval(tickCountdown, 1000); }
  }
}
function toggleAns(b, force){
  const panel = $('#ans-' + b.dataset.i), open = force === undefined ? panel.hidden : force;
  panel.hidden = !open; b.setAttribute('aria-expanded', String(open)); b.textContent = open ? 'Hide answers ▲' : 'Show answers ▼';
}
function tickCountdown(){
  const el = $('#nextin'); if (!el){ clearInterval(countdown); return; }
  const now = new Date(), mid = new Date(now); mid.setHours(24, 0, 0, 0);
  if (todayStr(now) !== S.daily.date){ clearInterval(countdown); render(); return; }
  const s = Math.floor((mid - now) / 1000);
  el.textContent = `Next drive in ${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
}
async function copyText(t, onOk){
  try { await navigator.clipboard.writeText(t); onOk(); }
  catch (e){ openSheet(`<h2 id="sheet-title">Copy this</h2><p class="dim">Select the text and copy it.</p><p style="white-space:pre-wrap;user-select:all;font-size:26px;word-break:break-word">${esc(t)}</p>`); }
}
function copyShare(){ copyText(shareText(cur()), () => { const t = $('#toast'); if (t) t.textContent = 'Copied! Paste it to your group chat.'; }); }

/* ---------- sheets ---------- */
let lastFocus = null;
function openSheet(html){
  stopClock(); lastFocus = document.activeElement;
  $('#sheet').innerHTML = `<button class="link close" id="close">Close ✕</button>${html}`;
  $('#modal').hidden = false; $('#close').onclick = closeSheet; $('#close').focus();
}
function closeSheet(){
  $('#modal').hidden = true;
  const g = cur();
  if (S.screen === 'game' && g.phase === 'play'){ startClock(g.left || CLOCK * 1000); $('#ans') && $('#ans').focus(); }
  else if (lastFocus) lastFocus.focus();
}
function helpHTML(){
  return `<h2 id="sheet-title">How to play</h2>
    <p>Seven NFL prompts. 25 seconds each. Type an answer and snap it.</p>
    <p>Wrong? Keep guessing until you hit a right answer or the clock runs out. Every right answer gains yards, and rarer answers gain more.</p>
    <p>You start at your own 25. Gain 40 yards for field goal range, 75 for a touchdown.</p>
    <ul class="tiers">${['K','S','P','F','H','C','X'].map(t => `<li style="--c:${TIER[t].c}"><span class="n">${TIER[t].name}</span><span class="y">+${TIER[t].yds}</span><span class="dim">${TIER[t].d}</span></li>`).join('')}</ul>
    <p class="dim">Same daily drive for everyone, new one at midnight. Every past drive stays playable in the archive. Practice drives are random and unlimited. Rarity tiers are estimates of how often fans give each answer. Lists are current through Super Bowl LX, the 2025 season and the 2026 draft. Stats stay in this browser.</p>`;
}
function statsHTML(){
  const days = Object.values(store.days).filter(g => g && g.phase === 'final');
  const yards = days.map(g => yardsOf(g.ans));
  const td = yards.filter(y => START + y >= 100).length, fg = yards.filter(y => START + y >= 65 && START + y < 100).length;
  const hm = days.reduce((s, g) => s + g.ans.filter(a => a.tier === 'H').length, 0);
  let streak = 0; const d = new Date();
  const fin = ds => store.days[ds] && store.days[ds].phase === 'final' && store.days[ds].finishedOn === ds;
  if (!fin(todayStr(d))) d.setDate(d.getDate() - 1);
  while (fin(todayStr(d))){ streak++; d.setDate(d.getDate() - 1); }
  const cell = (v, l) => `<div class="stat frame"><b>${v}</b><span>${l}</span></div>`;
  return `<h2 id="sheet-title">Your stats</h2>
    <div class="stats">${cell(days.length, 'Drives')}${cell(td, 'Touchdowns')}${cell(fg, 'Field goals')}${cell(yards.length ? Math.max(...yards) : 0, 'Best yds')}${cell(yards.length ? Math.round(yards.reduce((a, b) => a + b, 0) / yards.length) : 0, 'Avg yds')}${cell(hm, 'Hail Marys')}${cell(streak, 'Streak')}</div>
    <p class="dim">Daily and archive drives. The streak counts daily drives finished on their own day. Kept in this browser.</p>`;
}

$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeSheet(); });

function boot(data){
  if (data && data.S && data.S.screen) S = data.S;
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});

</script>
</body>
</html>
